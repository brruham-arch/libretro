name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Lua
        run: |
          set -e
          cd app/src/main/cpp
          if [ ! -d lua ]; then
            curl -fsSL --retry 3 https://www.lua.org/ftp/lua-5.4.6.tar.gz -o lua.tgz
            mkdir lua
            tar xzf lua.tgz -C lua --strip-components=1
            rm lua.tgz
          fi
          ls lua/src | head -3
      - name: SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: nes-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
